
name: MuleSoft SAPI CI-CD

on:
  workflow_call:
    inputs:
      deploy_environment:
        description: GitHub Environment to use
        required: true
        type: string

  push:
    branches:
      - mainn

permissions:
  contents: read

jobs:
  build:
    name: Build and publish to Exchange
    runs-on: ubuntu-latest

    environment: ${{ inputs.deploy_environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Build and publish to Exchange
        run: >
          mvn --batch-mode clean deploy
          --settings .settings/settings.xml
          -DskipMunitTests
          -Dbusiness.group.id=${{ secrets.BUSINESS_ORG_ID }}
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}

  deploy:
    name: Deploy to CloudHub 2.0
    needs: build
    runs-on: ubuntu-latest

    environment: ${{ inputs.deploy_environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: maven

      - name: Deploy to CloudHub 2.0
        run: >
          mvn --batch-mode clean package mule:deploy
          --settings .maven/settings.xml
          -DskipMunitTests
          -Dbusiness.group.id=${{ secrets.BUSINESS_ORG_ID }}
          -Dca.client.id=${{ secrets.CA_CLIENT_ID }}
          -Dca.client.secret=${{ secrets.CA_CLIENT_SECRET }}
          -Dch.environment=${{ vars.CH_ENVIRONMENT }}
          -Dplatform.client.id=${{ secrets.PLATFORM_CLIENT_ID }}
          -Dplatform.client.secret=${{ secrets.PLATFORM_CLIENT_SECRET }}
          -Dmule.key=${{ secrets.MULE_KEY }}
          -Denv=${{ vars.DEPLOY_ENV }}
          -DtargetName=${{ vars.TARGET_NAME }}
